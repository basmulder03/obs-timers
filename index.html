<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OBS Timers Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="assets/css/base.css" />
    <link rel="stylesheet" href="assets/css/themes.css" />
    <link rel="stylesheet" href="assets/css/site.css" />
  </head>
  <body class="solid-bg theme-steel">
    <header class="site-nav">
      <div><strong>OBS Timers</strong></div>
      <nav class="links">
        <a class="active" href="index.html">Builder</a>
        <a href="community/index.html">Community</a>
        <a href="docs/index.html">Docs</a>
      </nav>
    </header>
    <main class="dashboard">
      <section class="panel">
        <h1>OBS Timers</h1>
        <p class="muted">Build timer links for browser sources and save reusable presets.</p>

        <form id="config-form">
          <div class="field-row">
            <label class="field">
              Type
              <select name="type">
                <option value="countdown">Countdown</option>
                <option value="stopwatch">Stopwatch</option>
                <option value="countup">Count Up</option>
                <option value="interval">Interval</option>
              </select>
            </label>
            <label class="field">
              Target
              <input name="target" type="text" maxlength="30" />
            </label>
          </div>

          <div class="field-row">
            <label class="field">
              Autostart
              <select name="autostart">
                <option value="1">On</option>
                <option value="0">Off</option>
              </select>
            </label>
            <label class="field">
              Show Milliseconds
              <select name="showMs">
                <option value="0">Off</option>
                <option value="1">On</option>
              </select>
            </label>
          </div>

          <div class="field-row">
            <label class="field">
              Theme
              <select name="theme">
                <option value="steel">Steel</option>
                <option value="amber">Amber</option>
                <option value="ice">Ice</option>
              </select>
            </label>
            <label class="field">
              Text Color
              <input name="color" type="color" />
            </label>
          </div>

          <div class="field-row">
            <label class="field">
              Renderer
              <select name="renderer">
                <option value="classic">Classic</option>
                <option value="seven">Seven Segment</option>
                <option value="flip">Flip Cards</option>
                <option value="ring">Analog Ring</option>
                <option value="splitflap">Split-Flap</option>
              </select>
            </label>
            <label class="field">
              Animations
              <select name="anim">
                <option value="1">On</option>
                <option value="0">Off</option>
              </select>
            </label>
          </div>

          <div class="field-row">
            <label class="field">
              Motion Intensity
              <select name="motion">
                <option value="low">Low</option>
                <option value="normal">Normal</option>
                <option value="high">High</option>
              </select>
            </label>
          </div>

          <div class="field-row">
            <label class="field">
              Overlay Info Strip
              <select name="showInfo">
                <option value="0">Off</option>
                <option value="1">On</option>
              </select>
            </label>
            <label class="field">
              Info Position
              <select name="infoPosition">
                <option value="tr">Top Right</option>
                <option value="tl">Top Left</option>
                <option value="br">Bottom Right</option>
                <option value="bl">Bottom Left</option>
              </select>
            </label>
          </div>

          <div class="field-row">
            <label class="field">
              Info Style
              <select name="infoStyle">
                <option value="chip">Chip</option>
                <option value="minimal">Minimal</option>
              </select>
            </label>
            <label class="field">
              Info Text (optional)
              <input name="infoText" type="text" maxlength="80" />
            </label>
          </div>

          <div id="renderer-seven" class="field-row" hidden>
            <label class="field">
              Segment Glow
              <select name="segmentGlow">
                <option value="1">On</option>
                <option value="0">Off</option>
              </select>
            </label>
          </div>

          <div id="renderer-flip" class="field-row" hidden>
            <label class="field">
              Flip Speed
              <select name="flipSpeed">
                <option value="slow">Slow</option>
                <option value="normal">Normal</option>
                <option value="fast">Fast</option>
              </select>
            </label>
          </div>

          <div id="renderer-ring" class="field-row" hidden>
            <label class="field">
              Ring Thickness
              <input name="ringThickness" type="number" min="4" max="32" step="1" />
            </label>
            <label class="field">
              Ring Ticks
              <select name="ringTicks">
                <option value="0">Off</option>
                <option value="1">On</option>
              </select>
            </label>
          </div>

          <div id="renderer-splitflap" class="field-row" hidden>
            <label class="field">
              Flap Speed
              <select name="flapSpeed">
                <option value="slow">Slow</option>
                <option value="normal">Normal</option>
                <option value="fast">Fast</option>
              </select>
            </label>
          </div>

          <div class="field-row">
            <label class="field">
              Font
              <input name="font" type="text" />
            </label>
            <label class="field">
              Font Size (px)
              <input name="size" type="number" min="36" max="260" step="1" />
            </label>
          </div>

          <div class="field-row">
            <label class="field">
              Background
              <select name="bg">
                <option value="transparent">Transparent</option>
                <option value="solid">Solid</option>
              </select>
            </label>
            <label class="field">
              Text Shadow
              <select name="shadow">
                <option value="1">On</option>
                <option value="0">Off</option>
              </select>
            </label>
          </div>

          <div id="type-countdown" class="field-row">
            <label class="field">
              Duration (seconds)
              <input name="duration" type="number" min="1" max="86400" step="1" />
            </label>
            <label class="field">
              End Mode
              <select name="endMode">
                <option value="stop">Stop</option>
                <option value="loop">Loop</option>
                <option value="overtime">Overtime</option>
              </select>
            </label>
          </div>

          <div id="type-countup" class="field-row" hidden>
            <label class="field">
              Start Offset (seconds)
              <input name="start" type="number" min="0" max="86400" step="1" />
            </label>
          </div>

          <div id="type-interval" hidden>
            <div class="field-row">
              <label class="field">
                Work (seconds)
                <input name="work" type="number" min="1" max="86400" step="1" />
              </label>
              <label class="field">
                Rest (seconds)
                <input name="rest" type="number" min="0" max="86400" step="1" />
              </label>
            </div>
            <div class="field-row">
              <label class="field">
                Rounds
                <input name="rounds" type="number" min="1" max="200" step="1" />
              </label>
              <label class="field">
                Auto Next
                <select name="autoNext">
                  <option value="1">On</option>
                  <option value="0">Off</option>
                </select>
              </label>
            </div>
            <div class="field-row">
              <label class="field">
                Final Mode
                <select name="finalMode">
                  <option value="stop">Stop</option>
                  <option value="loop">Loop</option>
                </select>
              </label>
            </div>
          </div>

          <hr />

          <h3>Presets</h3>
          <div class="field-row">
            <label class="field">
              Preset Name
              <input id="preset-name" type="text" maxlength="40" />
            </label>
            <label class="field">
              Saved Presets
              <select id="preset-select"></select>
            </label>
          </div>

          <div class="actions">
            <button type="button" id="save-preset" class="primary">Save Preset</button>
            <button type="button" id="load-preset">Load Preset</button>
            <button type="button" id="delete-preset">Delete Preset</button>
          </div>

          <p id="message" class="muted"></p>

          <hr />

          <h3>Command URL</h3>
          <label class="field">
            Command Type
            <select name="cmd">
              <option value="toggle">Toggle</option>
              <option value="start">Start</option>
              <option value="pause">Pause</option>
              <option value="reset">Reset</option>
            </select>
          </label>

          <hr />

          <h3>Import / Export</h3>
          <label class="field">
            Config JSON or Timer URL
            <textarea id="config-json" class="json-box" placeholder='{"type":"countdown", ...} or https://.../timers/countdown.html?...'></textarea>
          </label>
          <div class="actions">
            <button type="button" id="export-config">Export JSON</button>
            <button type="button" id="copy-config-json">Copy JSON</button>
            <button type="button" id="import-config" class="primary">Import</button>
            <button type="button" id="copy-share-template">Copy Share Template</button>
          </div>
        </form>
      </section>

      <section class="panel preview">
        <div>
          <h2>Generated URLs</h2>

          <label class="field">
            Timer URL (use in OBS Browser Source)
            <textarea id="timer-url" class="url-box" readonly></textarea>
          </label>
          <div class="actions">
            <button type="button" id="copy-timer-url" class="primary">Copy Timer URL</button>
          </div>

          <label class="field">
            Command URL (optional control trigger)
            <textarea id="control-url" class="url-box" readonly></textarea>
          </label>
          <div class="actions">
            <button type="button" id="copy-control-url">Copy Command URL</button>
          </div>
        </div>

        <iframe id="preview-frame" title="Timer preview"></iframe>
      </section>
    </main>

    <script type="module" src="assets/js/pages/dashboard.js"></script>
  </body>
</html>
