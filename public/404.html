<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting...</title>
    <script>
      (function () {
        const l = window.location;
        const path = l.pathname.replace(/^\/obs-timers/, "") || "/";
        const query = l.search ? l.search.slice(1) : "";
        const hash = l.hash ? l.hash.slice(1) : "";
        const base = "/obs-timers/";
        const redirect = `${base}?p=${encodeURIComponent(path)}${query ? `&q=${encodeURIComponent(query)}` : ""}${hash ? `&h=${encodeURIComponent(hash)}` : ""}`;
        l.replace(redirect);
      })();
    </script>
  </head>
  <body></body>
</html>
